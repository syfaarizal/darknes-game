<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mafia Chronicles - Character Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
:root{--bg-dark:#0a0a0a;--bg-card:#121212;--accent-gold:#c9a227;--accent-gold-light:#e8d48b;--accent-red:#8b0000;--accent-red-light:#cc0000;--text-primary:#f0e6d3;--text-secondary:#8a8a8a;--border-dark:#2a2a2a;--glow-gold:rgba(201,162,39,0.6);--glow-red:rgba(139,0,0,0.6)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rajdhani',sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh}
.bg-pattern{position:fixed;inset:0;background:radial-gradient(ellipse at 20% 80%,rgba(139,0,0,0.15) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(201,162,39,0.1) 0%,transparent 50%),repeating-linear-gradient(45deg,transparent,transparent 2px,rgba(201,162,39,0.03) 2px,rgba(201,162,39,0.03) 4px);pointer-events:none;z-index:0}
.top-nav{position:fixed;top:0;left:0;right:0;height:60px;background:linear-gradient(180deg,rgba(10,10,10,0.98) 0%,rgba(10,10,10,0.95) 100%);border-bottom:1px solid var(--border-dark);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:100}
.nav-brand{font-family:'Cinzel',serif;font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent-gold) 0%,var(--accent-gold-light) 50%,var(--accent-gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:2px}
.nav-icons{display:flex;gap:8px}
.nav-icon{width:42px;height:42px;background:rgba(255,255,255,0.03);border:1px solid var(--border-dark);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;position:relative}
.nav-icon:hover{background:rgba(201,162,39,0.1);border-color:var(--accent-gold);transform:translateY(-2px)}
.nav-icon svg{width:20px;height:20px;fill:var(--text-secondary);transition:fill .3s}
.nav-icon:hover svg{fill:var(--accent-gold)}
.nav-icon.active{background:rgba(201,162,39,0.15);border-color:var(--accent-gold)}
.nav-icon.active svg{fill:var(--accent-gold)}
.nav-icon.gallery-icon{border-color:var(--accent-gold)}
.nav-icon.gallery-icon::after{content:'';position:absolute;top:-2px;right:-2px;width:8px;height:8px;background:var(--accent-red);border-radius:50%;animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.2);opacity:.7}}
.main-content{padding-top:80px;padding-bottom:40px;position:relative;z-index:1}
.gallery-header{text-align:center;margin-bottom:40px;padding:0 20px}
.gallery-title{font-family:'Cinzel',serif;font-size:2rem;font-weight:700;margin-bottom:8px}
.gallery-subtitle{font-size:1rem;color:var(--text-secondary);letter-spacing:1px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:30px;padding:0 40px;max-width:1400px;margin:0 auto}
.card-wrapper{perspective:1000px}
.character-card{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:visible;cursor:pointer;transition:transform .3s}
.character-card:hover{transform:translateY(-8px) scale(1.02)}
.card-border{position:absolute;inset:-3px;border-radius:14px;z-index:-1}
.card-image{width:100%;height:100%;border-radius:12px;object-fit:cover;position:relative;z-index:1}
.card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,0.9) 100%);border-radius:12px;z-index:2}
.card-info{position:absolute;bottom:0;left:0;right:0;padding:20px 15px;z-index:3}
.card-name{font-family:'Cinzel',serif;font-size:1.1rem;font-weight:600;margin-bottom:4px}
.card-role{font-size:.75rem;color:var(--accent-gold);text-transform:uppercase;letter-spacing:2px}
.card-rarity{position:absolute;top:12px;right:12px;padding:4px 10px;font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:1px;border-radius:4px;z-index:4}
.rarity-legendary{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;box-shadow:0 0 15px rgba(255,215,0,0.5)}
.rarity-epic{background:linear-gradient(135deg,#9b59b6,#8e44ad);color:#fff;box-shadow:0 0 15px rgba(155,89,182,0.5)}
.rarity-rare{background:linear-gradient(135deg,#3498db,#2980b9);color:#fff;box-shadow:0 0 15px rgba(52,152,219,0.5)}
.rarity-common{background:rgba(100,100,100,0.9);color:#fff}
.border-gold-glow{background:linear-gradient(90deg,var(--accent-gold),var(--accent-gold-light),var(--accent-gold));background-size:200% 100%;animation:gold-shimmer 3s linear infinite;box-shadow:0 0 20px var(--glow-gold),inset 0 0 20px rgba(0,0,0,0.5)}
.border-gold-glow::before{content:'';position:absolute;inset:2px;background:var(--bg-card);border-radius:12px}
.border-gold-glow::after{content:'';position:absolute;inset:-8px;background:radial-gradient(ellipse at center,var(--glow-gold) 0%,transparent 70%);border-radius:20px;animation:glow-pulse 2s ease-in-out infinite;z-index:-2}
@keyframes gold-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes glow-pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.8;transform:scale(1.05)}}
.border-blood{background:linear-gradient(180deg,var(--accent-red) 0%,#4a0000 50%,var(--accent-red) 100%);animation:blood-flow 4s ease-in-out infinite;box-shadow:0 0 25px var(--glow-red)}
.border-blood::before{content:'';position:absolute;inset:2px;background:var(--bg-card);border-radius:12px}
.border-blood::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:60%;height:10px;background:radial-gradient(ellipse at center,rgba(139,0,0,0.8) 0%,transparent 70%);filter:blur(3px);animation:drip 3s ease-in-out infinite}
@keyframes blood-flow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
@keyframes drip{0%,100%{opacity:0;height:10px}50%{opacity:1;height:25px}}
.border-diamond{background:conic-gradient(from 0deg,var(--accent-gold),#fff,var(--accent-gold),#fff,var(--accent-gold));animation:diamond-rotate 8s linear infinite;box-shadow:0 0 30px var(--glow-gold)}
.border-diamond::before{content:'';position:absolute;inset:3px;background:var(--bg-card);border-radius:10px}
.border-diamond::after{content:'';position:absolute;inset:-6px;background:conic-gradient(from 180deg,transparent,var(--accent-gold-light),transparent,var(--accent-gold-light),transparent);border-radius:18px;animation:diamond-rotate 6s linear infinite reverse;opacity:.5}
@keyframes diamond-rotate{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.border-particle{background:var(--bg-card);border:2px solid var(--accent-gold);box-shadow:0 0 20px var(--glow-gold),inset 0 0 30px rgba(201,162,39,0.1)}
.border-particle::before{content:'';position:absolute;inset:-10px;background:radial-gradient(circle at 20% 30%,var(--accent-gold) 1px,transparent 1px),radial-gradient(circle at 80% 70%,var(--accent-gold-light) 1px,transparent 1px),radial-gradient(circle at 50% 50%,var(--accent-gold) 0.5px,transparent 0.5px);background-size:100% 100%;animation:particle-float 4s ease-in-out infinite;border-radius:16px}
.border-particle::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(201,162,39,0.3),transparent);animation:scan-line 3s linear infinite;border-radius:12px}
@keyframes particle-float{0%,100%{transform:translateY(0) rotate(0deg);opacity:.8}50%{transform:translateY(-10px) rotate(5deg);opacity:1}}
@keyframes scan-line{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.new-badge{position:absolute;top:-8px;left:-8px;padding:6px 12px;background:linear-gradient(135deg,var(--accent-red) 0%,var(--accent-red-light) 100%);color:#fff;font-family:'Cinzel',serif;font-size:.7rem;font-weight:700;border-radius:6px;z-index:10;box-shadow:0 4px 15px rgba(139,0,0,0.5);animation:badge-bounce 1s ease-in-out infinite}
@keyframes badge-bounce{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.1) rotate(-3deg)}}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .4s}
.popup-overlay.active{opacity:1;visibility:visible}
.popup-content{position:relative;transform:scale(.8) translateY(20px);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.popup-overlay.active .popup-content{transform:scale(1) translateY(0)}
.popup-card{width:280px;aspect-ratio:3/4;border-radius:16px;overflow:hidden;position:relative}
.popup-close{position:absolute;top:-40px;right:0;width:32px;height:32px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:50%;color:#fff;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s}
.popup-close:hover{background:var(--accent-red);border-color:var(--accent-red)}
.popup-title{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:700;text-align:center;margin-bottom:20px;color:var(--accent-gold);text-shadow:0 0 20px var(--glow-gold)}
.popup-new-text{text-align:center;font-size:.9rem;color:var(--text-secondary);margin-top:15px;letter-spacing:2px;text-transform:uppercase}
.popup-buttons{display:flex;gap:10px;justify-content:center;margin-top:20px}
.popup-btn{padding:10px 25px;border-radius:6px;font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .3s;text-transform:uppercase;letter-spacing:1px}
.popup-btn-primary{background:linear-gradient(135deg,var(--accent-gold) 0%,var(--accent-gold-light) 100%);color:#000;border:none}
.popup-btn-primary:hover{transform:translateY(-2px);box-shadow:0 5px 20px var(--glow-gold)}
.popup-btn-secondary{background:transparent;color:var(--text-primary);border:1px solid var(--border-dark)}
.popup-btn-secondary:hover{border-color:var(--accent-gold);color:var(--accent-gold)}
.placeholder-card{background:linear-gradient(135deg,#1a1a1a 0%,#0d0d0d 100%);border:2px dashed var(--border-dark);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-secondary)}
.placeholder-card svg{width:48px;height:48px;margin-bottom:10px;opacity:.5;fill:var(--text-secondary)}
.placeholder-card span{font-size:.8rem}
.placeholder-card .lock-icon{margin-top:8px}
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <nav class="top-nav">
        <div class="nav-brand">MAFIA CHRONICLES</div>
        <div class="nav-icons">
            <button class="nav-icon" title="History"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></button>
            <button class="nav-icon" title="Save"><svg viewBox="0 0 24 24"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg></button>
            <button class="nav-icon gallery-icon active" title="Character Gallery"><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9h-4v4h-2v-4H9V9h4V5h2v4h4v2z"/></svg></button>
            <button class="nav-icon" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></button>
            <button class="nav-icon" title="Menu"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        </div>
    </nav>
    <main class="main-content">
        <div class="gallery-header">
            <h1 class="gallery-title">Character Gallery</h1>
            <p class="gallery-subtitle">Collected Cards: <span id="cardCount">6</span> / <span id="totalCount">6</span></p>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </main>
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-content">
            <button class="popup-close" onclick="closePopup()">x</button>
            <div class="popup-title">New Character!</div>
            <div class="popup-card" id="popupCard"></div>
            <div class="popup-new-text">Added to your collection</div>
            <div class="popup-buttons">
                <button class="popup-btn popup-btn-primary" onclick="closePopup()">Collect</button>
                <button class="popup-btn popup-btn-secondary" onclick="closePopup()">View Gallery</button>
            </div>
        </div>
    </div>
    <script>
const characters=[
    {id:"xyera",name:"Xyera",role:"Boss Lady",rarity:"legendary",border:"gold-glow",image:"assets/cards/xyera.webp",isNew:true},
    {id:"elenna",name:"Elenna",role:"Enforcer",rarity:"epic",border:"diamond",image:"assets/cards/elenna.webp",isNew:true},
    {id:"keyna",name:"Keyna",role:"Informant",rarity:"rare",border:"blood",image:"assets/cards/keyna.webp",isNew:false},
    {id:"rachel",name:"Rachel",role:"Accountant",rarity:"rare",border:"particle",image:"assets/cards/rachel.webp",isNew:false},
    {id:"henry",name:"Henry",role:"Soldier",rarity:"common",border:"blood",image:"assets/cards/henry.webp",isNew:false},
    {id:"azaroth",name:"Azaroth",role:"Rival Boss",rarity:"legendary",border:"diamond",image:"assets/cards/azaroth.webp",isNew:false}
];
function createPlaceholder(n){return '<div class="placeholder-card"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>'+n+'</span><svg class="lock-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></div>';}
function createCardHTML(c){var img=c.image?'<img src="'+c.image+'" alt="'+c.name+'" class="card-image" onerror="this.parentElement.innerHTML=createPlaceholder(\'\'+c.name+'\')">':createPlaceholder(c.name);return '<div class="card-wrapper"><div class="character-card" onclick="showCardDetail(\'\'+c.id+'\')"><div class="card-border border-'+c.border+'"></div>'+img+'</div><div class="card-overlay"></div>'+(c.isNew?'<div class="new-badge">NEW</div>':'')+'<span class="card-rarity rarity-'+c.rarity+'">'+c.rarity+'</span><div class="card-info"><div class="card-name">'+c.name+'</div><div class="card-role">'+c.role+'</div></div></div></div>';}
function renderGallery(){document.getElementById('galleryGrid').innerHTML=characters.map(function(c){return createCardHTML(c);}).join('');}
function showNewCharacterPopup(id){var c=characters.find(function(x){return x.id===id;});if(!c)return;document.getElementById('popupCard').innerHTML='<div class="card-border border-'+c.border+'" style="inset:-3px;"></div>'+(c.image?'<img src="'+c.image+'" alt="'+c.name+'" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">':createPlaceholder(c.name))+'<div class="card-overlay" style="border-radius:16px;"></div><span class="card-rarity rarity-'+c.rarity+'" style="top:15px;right:15px;">'+c.rarity+'</span><div class="card-info"><div class="card-name">'+c.name+'</div><div class="card-role">'+c.role+'</div></div>';document.getElementById('popupOverlay').classList.add('active');}
function closePopup(){document.getElementById('popupOverlay').classList.remove('active');}
function showCardDetail(id){showNewCharacterPopup(id);}
setTimeout(function(){showNewCharacterPopup('xyera');},1500);
renderGallery();
    </script>
</body>
</html>
